<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Countdown</title>
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/script.js" type="module"></script>
</head>
<body>
    <header>
        <h1>Luka's super fancy ultra cool timers 😎😎😎</h1>
    </header>
    <main>
        <div id="timers"></div>
        <template>
            <div class="timer">
                <h2>Timer name</h2>
                <div>
                    <span>Date: </span>
                    <span class="months bold">xxx</span>
                </div>
                <div>
                    <span>Days left: </span>
                    <span class="days bold">xxx</span>
                </div>
                <div>
                    <span>Hours (+-): </span>
                    <span class="hours bold">xxx</span>
                </div>
            </div>
        </template>
    </main>
    <footer>
        <p>© Made with ❤️ by <a target="_blank" href="https://lukaverbrugghe.github.io/luka-verbrugghe-io/">Luka Verbrugghe</a>; all rights reserved</p>
    </footer>
</body>
</html>
